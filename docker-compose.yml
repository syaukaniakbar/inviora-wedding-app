services:
  frontend:
    image: node:20-alpine
    container_name: inviora-wedding-dev

    working_dir: /app

    volumes:
      - .:/app
      - /app/node_modules

    ports:
      - "5173:5173"

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

    stdin_open: true
    tty: true
